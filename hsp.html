<style>

  </main>
  <footer>仅作个人自我观察。可按真实生活中的体验理解本次结果。</footer>

  heading.append(element('span', String(i + 1).padStart(2, '0'), 'qnum'), document.createTextNode(item.prompt));
  card.append(heading);
  const group = element('fieldset', '', 'options');
  group.append(element('legend', '第 ' + (i + 1) + ' 题选项', 'sr'));
  if (mbti) {
    const pairs = element('div', '', 'dual');
    pairs.id = 'pairs-' + i;
    for (const [letter, text] of [['A', item.a], ['B', item.b]]) {
      const content = element('p');
      content.append(element('b', letter), document.createTextNode(text));
      pairs.append(content);
    }
    card.append(pairs);
    group.setAttribute('aria-describedby', heading.id + ' ' + pairs.id);
  } else group.setAttribute('aria-describedby', heading.id);
  for (let j = 0; j < config.choices.length; j += 1) {
    const label = element('label', '', 'choice');
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'q' + i;
    input.value = String(j);
    input.checked = values[i] === j;
    label.append(input, element('span', config.choices[j]));
    group.append(label);
  }
  card.append(group);
  return card;
}

/** 打开当前题页并恢复选择。参数无。返回无。 */
function renderQuestions() {
  show('exam');
  get('page-count').textContent = '第 ' + (page + 1) + ' / ' + pageTotal + ' 页';
  const first = page * pageSize;
  const last = Math.min(values.length, first + pageSize);
  const impact = !mbti && first >= config.coreCount;
  get('page-title').textContent = impact ? '这些体验影响了你的日常吗？' : '第 ' + (first + 1) + '–' + last + ' 题';
  get('page-help').textContent = impact ? '按近三个月的实际情况回答。下面三题单独解读。' : config.pageHelp;
  get('questions').replaceChildren();
  for (let i = first; i < last; i += 1) get('questions').append(question(config.items[i], i));
  get('message').textContent = '';
  get('prev').disabled = page === 0;
  get('next').textContent = page === pageTotal - 1 ? '查看结果' : '下一页';
  updateProgress();
  get('page-title').focus({preventScroll:true});
}

/** 处理单选变化。参数 event（Event，当前修改事件）。返回无。 */
function answer(event) {
  const input = event.target;
  if (!(input instanceof HTMLInputElement) || input.type !== 'radio') return;
  values[Number(input.name.slice(1))] = Number(input.value);
  input.closest('.question').classList.remove('missing');
  get('message').textContent = '';
  updateProgress();
}

/** 检查当前题页并继续。参数无。返回无。 */
function next() {
  const first = page * pageSize;
  const last = Math.min(values.length, first + pageSize);
  for (let i = first; i < last; i += 1) {
    if (values[i] !== null) continue;
    const input = document.querySelector('input[name="q' + i + '"]');
    input.closest('.question').classList.add('missing');
    get('message').textContent = '第 ' + (i + 1) + ' 题还没选。';
    input.focus({preventScroll:true});
    input.closest('.question').scrollIntoView({block:'start'});
    return;
  }
  if (page + 1 < pageTotal) {
    page += 1;
    renderQuestions();
  } else renderResult();
}

/** 计算四组偏好。参数无。返回对象数组（各维度分数、字母和说明）。 */
function mbtiScores() {
  const results = [];
  for (const [d, axis] of config.axes.entries()) {
    let score = 0;
    for (const [i, item] of config.items.entries()) {
      if (item.axis === d) score += (2 - values[i]) * (item.aLeft ? 1 : -1);
    }
    results.push({axis, score, result: Math.abs(score) <= 4 ? 'X' : axis.letters[score > 0 ? 0 : 1]});
  }
  return results;
}

/** 计算六组体验。参数无。返回对象数组（各维度均分和高频题数）。 */
function hspScores() {
  const results = [];
  for (const [d, axis] of config.axes.entries()) {
    let total = 0;
    let frequent = 0;
    let valid = 0;
    for (const [i, item] of config.items.entries()) {
      if (item.axis !== d || values[i] === 5) continue;
      valid += 1;
      const score = item.reverse ? 5 - values[i] : values[i] + 1;
      total += score;
      if (score >= 4) frequent += 1;
    }
    results.push({axis, mean: valid ? total / valid : null, frequent, valid});
  }
  return results;
}

/** 制作结果分数轨道。参数 position（数字，百分位置）、centered（布尔，是否以中线为基准）。返回 HTMLElement（分数图）。 */
function track(position, centered) {
  const line = element('div', '', 'track' + (centered ? ' mbti' : ''));
  const mark = element('div', '', centered ? 'dot' : 'fill');
  line.setAttribute('aria-hidden', 'true');
  mark.style[centered ? 'left' : 'width'] = position + '%';
  line.append(mark);
  return line;
}

/** 生成一个维度的结果卡。参数 result（维度分数对象）。返回 HTMLElement（解释卡）。 */
function resultCard(result) {
  const card = element('article', '', 'report-card');
  card.append(element('h3', result.axis.title));
  if (mbti) {
    const {axis, score} = result;
    const verdict = result.result === 'X' ? '两边接近' : '本次更靠近 ' + result.result;
    const numeric = (score > 0 ? '+' : '') + score;
    const ends = element('div', '', 'scales');
    ends.append(element('span', axis.letters[0]), element('span', '接近'), element('span', axis.letters[1]));
    card.append(element('strong', verdict + '　｜　偏向分 ' + numeric), track(50 - score / 64 * 100, true), ends, element('p', axis.explain));
  } else {
    if (result.valid >= 6) {
      card.append(element('strong', result.mean.toFixed(1) + ' / 5　｜　' + result.frequent + ' / ' + result.valid + ' 题高频'),
        track((result.mean - 1) * 25, false), element('p', result.axis.explain), element('p', result.axis.action));
    } else card.append(element('strong', '本组资料不足　｜　' + result.valid + ' / 8 题可判断'), element('p', result.axis.explain));
  }
  return card;
}

/** 展示报告、计分解释与可选动作。参数无。返回无。 */
function renderResult() {
  show('result');
  const results = mbti ? mbtiScores() : hspScores();
  get('cards').replaceChildren();
  for (const result of results) get('cards').append(resultCard(result));
  const follow = get('follow');
  if (mbti) {
    let code = '';
    for (const result of results) code += result.result;
    get('outcome').textContent = code;
    get('summary-text').textContent = code.includes('X')
      ? 'X 表示这一组的两侧得分接近。例如 INXJ 可以对照 INTJ 和 INFJ 的偏好描述，先看看自己在不同场合的做法。'
      : '这是本次答案组合出的四字母候选。可以从下面四组描述里找贴近自己的部分，再用现实例子核对。';
    follow.replaceChildren(element('h2', '找一个现实例子来对照'),
      element('p', '选一组你最不确定的偏好，回想一次无人要求你扮演某种角色的场合。写下当时你先做了什么、为什么选它、换个环境会不会不同。'),
      element('p', 'E / I 与谈话技巧是不同的问题。T / F 也不表示谁更理性或更体贴。四组偏好都允许你在不同场合使用两种方法。'));
  } else {
    let matched = 0;
    let eligible = 0;
    for (const result of results) {
      if (result.valid < 6) continue;
      eligible += 1;
      if (result.frequent >= Math.ceil(result.valid * 5 / 8)) matched += 1;
    }
    let description = '本次没有成组的高频体验';
    if (matched >= 1) description = '部分体验比较常见';
    if (matched >= 4) description = '多方面体验比较常见';
    if (eligible < 4) description = '可解读的体验组较少';
    get('outcome').textContent = description;
    get('summary-text').textContent = '六组中有 ' + eligible + ' 组信息足够解读，其中 ' + matched + ' 组的高频回答达到本问卷的展示门槛。可以结合下方各组和具体场景看。';
    follow.replaceChildren(element('h2', '单独看日常影响'));
    let considerable = false;
    for (const [j, label] of ['工作、学习与家务','休息或入睡','活动参与和来往'].entries()) {
      const level = values[config.coreCount + j];
      if (level === 3 || level === 4) considerable = true;
      follow.append(element('p', label + '：' + config.choices[level]));
    }
    follow.append(element('p', considerable
      ? '至少一个领域经常受影响。可以记录最常见的触发、持续时间和缓解办法。若持续影响生活，可把记录带给合格专业人员进一步评估。'
      : '如果想验证体验和环境的关系，可以选一组，在两个相似场合只改一个条件，例如座位、音量或停留时间。'));
  }
  get('scoring').textContent = config.scoring;
  get('outcome').focus({preventScroll:true});
}

/** 构建打印用题目，并调用打印。参数无。返回无。 */
function printPaper() {
  const paper = get('paper');
  if (!paper.childElementCount) {
    paper.append(element('h1', config.title), element('p', config.instructions + '　' + config.scope),
      element('p', '在每题下选一项。答完后可在电子版录入所选项，自动生成结果。'));
    for (const [i, item] of config.items.entries()) {
      const row = element('div', '', 'print-q');
      row.append(element('h3', (i + 1) + '．' + item.prompt));
      if (mbti) row.append(element('p', 'A　' + item.a + '　　B　' + item.b));
      row.append(element('p', '○ ' + config.choices.join('　　○ ')));
      paper.append(row);
    }
  }
  document.body.dataset.print = 'paper';
  window.print();
}

/** 打印当前结果。参数无。返回无。 */
function printResult() {
  document.body.dataset.print = 'result';
  window.print();
}

/** 回上一题页。参数无。返回无。 */
function previous() {
  if (page === 0) return;
  page -= 1;
  renderQuestions();
}

/** 清空已答选项后回到首页。参数无。返回无。 */
function restart() {
  if (!window.confirm('清空本次全部答案并从第一题开始？')) return;
  values.fill(null);
  page = 0;
  show('start');
  get('begin').focus();
}

for (const id of ['time','eyebrow','title','intro','instructions','scope','method']) get(id).textContent = config[id];
for (const [name, url] of config.sources) {
  const link = element('a', name);
  link.href = url;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  const item = element('li');
  item.append(link);
  get('source-list').append(item);
}
get('begin').addEventListener('click', renderQuestions);
get('questions').addEventListener('change', answer);
get('next').addEventListener('click', next);
get('prev').addEventListener('click', previous);
get('review').addEventListener('click', renderQuestions);
get('restart').addEventListener('click', restart);
get('print-paper').addEventListener('click', printPaper);
get('print-result').addEventListener('click', printResult);




</script>
</body>
</html>
